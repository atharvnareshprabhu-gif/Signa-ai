<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal AI — Cut through...</title>
    <style>
        :root {
            --theme-color: #0070f3;
            --theme-bg-light: #eff6ff;
            --theme-border: #0070f3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            padding: 20px 12px;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .header-section {
            text-align: center;
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .subtitle-badge {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--theme-color);
            margin-bottom: 4px;
            transition: color 0.3s ease;
        }

        .main-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.8px;
            margin-bottom: 6px;
        }

        .tagline {
            color: #64748b;
            font-size: 0.95rem;
        }

        /* Top Navigation Tabs */
        .mode-nav {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 14px;
            width: 100%;
            gap: 4px;
        }

        .nav-tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            border-radius: 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-tab.active {
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .tab-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-tab.active .tab-title {
            color: var(--theme-color);
        }

        .tab-sub {
            font-size: 0.68rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Main Input Card */
        .main-card {
            background: #ffffff;
            border: 2px solid var(--theme-border);
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            transition: border-color 0.3s ease;
        }

        .main-card textarea {
            width: 100%;
            height: 180px;
            border: none;
            outline: none;
            resize: none;
            font-family: monospace, monospace;
            font-size: 0.95rem;
            color: #334155;
            line-height: 1.5;
            background: transparent;
        }

        .main-card textarea::placeholder {
            color: #94a3b8;
        }

        .char-counter {
            text-align: right;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .section-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 6px;
        }

        .chips-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip-btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .chip-btn.active {
            background: #f3e8ff;
            border-color: #a855f7;
            color: #7e22ce;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 8px;
        }

        .footer-note {
            font-size: 0.78rem;
            color: #64748b;
            flex: 1;
        }

        .action-button {
            background: var(--theme-color);
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease;
            white-space: nowrap;
        }

        /* Output Card */
        .output-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            display: none;
        }

        .output-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--theme-color);
            margin-bottom: 10px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .output-content {
            font-size: 0.95rem;
            color: #334155;
            line-height: 1.6;
        }

        /* 3-Dots Loading Animation */
        .dots-loader {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            padding: 8px 0;
        }

        .dots-loader div {
            width: 8px;
            height: 8px;
            background-color: var(--theme-color);
            border-radius: 50%;
            animation: dotPulse 1.4s infinite ease-in-out both;
        }

        .dots-loader div:nth-child(1) { animation-delay: -0.32s; }
        .dots-loader div:nth-child(2) { animation-delay: -0.16s; }

        @keyframes dotPulse {
            0%, 80%, 100% { 
                transform: scale(0);
                opacity: 0.3;
            } 40% { 
                transform: scale(1);
                opacity: 1;
            }
        }

        .page-footer {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="brand-title">Signal AI</div>

        <div class="header-section">
            <div class="subtitle-badge" id="sub-badge">SIGNAL EXTRACTOR</div>
            <div class="main-title">Signal AI</div>
            <div class="tagline">Cut through the noise, keep only what matters.</div>
        </div>

        <!-- Mode Navigation -->
        <div class="mode-nav">
            <button class="nav-tab active" onclick="setAppMode('extract')" id="tab-extract">
                <span class="tab-title">⚡ Extract</span>
                <span class="tab-sub">Brutal Summary</span>
            </button>
            <button class="nav-tab" onclick="setAppMode('refine')" id="tab-refine">
                <span class="tab-title">✨ Refine</span>
                <span class="tab-sub">Rewrite Content</span>
            </button>
            <button class="nav-tab" onclick="setAppMode('score')" id="tab-score">
                <span class="tab-title">📊 Score</span>
                <span class="tab-sub">Signal Score</span>
            </button>
        </div>

        <!-- Input Area Card -->
        <div class="main-card">
            <textarea id="user-input" maxlength="3000" oninput="updateCounter()" placeholder="Paste that long, fluff-filled LinkedIn post, blog, or tweet thread here..."></textarea>
            
            <div class="char-counter"><span id="char-count">0</span> / 3000</div>

            <div id="options-container">
                <div class="section-label" id="options-label">Try an example:</div>
                <div class="chips-row" id="chips-wrapper"></div>
            </div>

            <div class="card-footer">
                <div class="footer-note" id="footer-text">No fluff. Just raw signals.</div>
                <button class="action-button" id="submit-btn" onclick="processAIRequest()">Extract Signal →</button>
            </div>
        </div>

        <!-- Output Result Box -->
        <div class="output-card" id="result-box">
            <div class="output-title" id="result-header">RESULT</div>
            <div class="output-content" id="result-body"></div>
        </div>

        <div class="page-footer">We score the signal, you save the time.</div>
    </div>

    <script>
        // 🔒 Vercel Backend URL paste karo
        // Example: "https://your-project-name.vercel.app/api/signal"
        const BACKEND_URL = "https://YOUR-PROJECT-NAME.vercel.app/api/signal";

        let currentMode = 'extract';
        let selectedTone = 'Founder';

        const themeMap = {
            extract: {
                color: '#0070f3',
                badge: 'SIGNAL EXTRACTOR',
                footer: 'No fluff. Just raw signals.',
                btnText: 'Extract Signal →',
                optionsLabel: 'Try an example:',
                chips: [
                    { label: '💼 LinkedIn Post', type: 'example' },
                    { label: '𝕏 Twitter Thread', type: 'example' },
                    { label: '📄 Blog Article', type: 'example' }
                ]
            },
            refine: {
                color: '#9333ea',
                badge: 'CONTENT REFINER',
                footer: 'No fluff. Just clear communication.',
                btnText: 'Refine Content →',
                optionsLabel: 'Choose a tone:',
                chips: [
                    { label: 'Founder', type: 'tone' },
                    { label: 'Professional', type: 'tone' },
                    { label: 'Casual', type: 'tone' },
                    { label: 'Twitter / X', type: 'tone' }
                ]
            },
            score: {
                color: '#22c55e',
                badge: 'SIGNAL INTEGRITY',
                footer: 'We score the signal, you save the time.',
                btnText: 'Calculate Score →',
                optionsLabel: 'Try an example:',
                chips: [
                    { label: '💼 LinkedIn Post', type: 'example' },
                    { label: '𝕏 Twitter Thread', type: 'example' },
                    { label: '📄 Blog Article', type: 'example' }
                ]
            }
        };

        function setAppMode(mode) {
            currentMode = mode;
            const config = themeMap[mode];

            document.documentElement.style.setProperty('--theme-color', config.color);
            document.documentElement.style.setProperty('--theme-border', config.color);

            document.getElementById('sub-badge').innerText = config.badge;
            document.getElementById('footer-text').innerText = config.footer;
            document.getElementById('submit-btn').innerText = config.btnText;
            document.getElementById('options-label').innerText = config.optionsLabel;

            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`tab-${mode}`).classList.add('active');

            const wrapper = document.getElementById('chips-wrapper');
            wrapper.innerHTML = '';
            
            config.chips.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'chip-btn';
                btn.innerText = c.label;
                
                if (c.type === 'tone' && c.label === selectedTone) {
                    btn.classList.add('active');
                }

                btn.onclick = () => {
                    if (c.type === 'tone') {
                        selectedTone = c.label;
                        document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    } else {
                        insertExampleText(c.label);
                    }
                };
                wrapper.appendChild(btn);
            });

            document.getElementById('result-box').style.display = 'none';
        }

        function updateCounter() {
            const val = document.getElementById('user-input').value;
            document.getElementById('char-count').innerText = val.length;
        }

        function insertExampleText(type) {
            const textarea = document.getElementById('user-input');
            if (type.includes('LinkedIn')) {
                textarea.value = "Unpopular opinion: Stop working 14 hours a day! I used to work non-stop, burning midnight oil until I realized true growth comes from smart leverage. Here are 5 brutal lessons I learned the hard way about productivity...";
            } else if (type.includes('Twitter')) {
                textarea.value = "1/10 Most founders fail not because of product, but distribution.\n2/10 Here is the exact playbook we used to reach $10k MRR in under 60 days without spent a single dollar on ads 🧵👇";
            } else {
                textarea.value = "Artificial intelligence is fundamentally restructuring software engineering paradigms. Traditional monolithic architectures are giving way to micro-agent workflows capable of self-healing codebases...";
            }
            updateCounter();
        }

        async function processAIRequest() {
            const text = document.getElementById('user-input').value.trim();
            if (!text) {
                alert("Please paste or type some text first!");
                return;
            }

            if (!BACKEND_URL || BACKEND_URL.includes("YOUR-PROJECT-NAME")) {
                alert("Please update BACKEND_URL with your Vercel deployment link!");
                return;
            }

            const resultBox = document.getElementById('result-box');
            const resultHeader = document.getElementById('result-header');
            const resultBody = document.getElementById('result-body');

            resultBox.style.display = 'block';
            resultHeader.innerText = currentMode.toUpperCase() + " RESULT";
            
            // Fast Dot Loader
            resultBody.innerHTML = `
                <div class="dots-loader">
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            `;

            let prompt = "";
            if (currentMode === 'extract') {
                prompt = "You are Signa AI. Extract ONLY raw factual signals/points. Absolutely no fluff, intros, or summaries. Format as concise bullet points.";
            } else if (currentMode === 'refine') {
                prompt = `You are Signa AI. Rewrite the input in a direct, high-impact ${selectedTone} tone. Max 2-3 sentences.`;
            } else {
                prompt = "You are Signa AI. Rate this content's signal-to-noise ratio out of 100. Provide a breakdown of Clarity, Actionability, and Verdict.";
            }

            try {
                // Vercel Serverless Function Call (Super Fast - Instant Response)
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.1-8b-instant', // Fast Instant Model
                        messages: [
                            { role: 'system', content: prompt },
                            { role: 'user', content: text }
                        ],
                        temperature: 0.2
                    })
                });

                const data = await response.json();
                
                let aiResult = "";
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    aiResult = data.choices[0].message.content.trim();
                } else if (data.result) {
                    aiResult = data.result;
                } else {
                    aiResult = JSON.stringify(data);
                }

                resultBody.innerText = aiResult;

            } catch (err) {
                resultHeader.innerText = "ERROR";
                resultBody.innerText = "Could not reach Vercel backend. Please verify your deployment URL or network connection.";
            }
        }

        // Initialize Extract Mode
        setAppMode('extract');
    </script>
</body>
</html>
